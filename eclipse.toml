[input]
directory = "."
pattern = "Eclipse_*.JPG"

[analysis]
work_directory = "work"
detection_threshold = 20
minimum_component_pixels = 2000
blur_threshold = 0.65

[render]
output = "output/eclipse_timelapse_source_anchored_instagram_4x5.mp4"
resolution = 1080
aspect_ratio = "4:5"
crop_size = 2000
duration_seconds = 26.25
frames_per_second = 60
timeline = "linear"
interpolation = "physical"
source_anchors = true
ingress_infill = true
ingress_infill_cutoff_seconds = 19.0
ingress_infill_minimum_gap_seconds = 0.75
ingress_infill_interval_seconds = 0.75
maximum_gap_seconds = 30.0
minimum_gap_seconds = 1.0
exclude_blurry = true
codec = "h264"
crf = 16
preset = "slow"
