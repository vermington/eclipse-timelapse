[input]
directory = "."
pattern = "Eclipse_*.JPG"

[analysis]
work_directory = "work"
detection_threshold = 20
minimum_component_pixels = 2000
blur_threshold = 0.65

[render]
output = "output/eclipse_timelapse_strict_linear_4x5.mp4"
resolution = 1080
aspect_ratio = "4:5"
crop_size = 2000
duration_seconds = 15.0
frames_per_second = 30
timeline = "linear"
interpolation = "physical"
maximum_gap_seconds = 30.0
minimum_gap_seconds = 1.0
exclude_blurry = true
crf = 16
preset = "slow"
